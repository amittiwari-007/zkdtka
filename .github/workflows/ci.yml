name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy app
      - name: Test
        run: uv run pytest --cov=app --cov-report=term-missing
      - name: OpenAPI schema is up to date
        run: |
          uv run python -m scripts.export_openapi /tmp/openapi.json
          diff -u ../frontend/src/api/openapi.json /tmp/openapi.json
      - name: requirements.txt matches the lockfile
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt \
            | grep -v '^ *#' | sed '/^$/d' > /tmp/requirements.txt
          grep -v '^ *#' ../requirements.txt | diff -u - /tmp/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: npm run gen:api && git diff --exit-code src/api/schema.ts
      - name: Lint
        run: npm run lint && npm run format:check
      - name: Type-check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --target runtime -t wind-forecast-desk .
      - name: Smoke test
        run: |
          docker run -d --name app -p 8000:8000 wind-forecast-desk
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 1; done
          curl -fsS "http://localhost:8000/api/day?delivery_date=2026-01-15" | grep -q '"runs_used"'
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
