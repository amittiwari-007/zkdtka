# Development: API with auto-reload + Vite dev server with hot module replacement.
#   docker compose -f docker-compose.dev.yml up --build   ->  http://localhost:5173
services:
  backend:
    build:
      context: .
      target: backend-dev
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      DATA_MODE: ${DATA_MODE:-snapshot}

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
